
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Insan Cendekia HUB</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1830;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 410px;
      background: white;
      padding: 38px;
      border-radius: 18px;
      box-shadow: 0 15px 45px rgba(0,0,0,.2);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand h1 {
      color: #10284b;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .brand p {
      color: #718096;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #26364d;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #2864a5;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #173b68;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #pesan {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      color: #bd3030;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #52647a;
      font-size: 13px;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="login-card">

    <div class="brand">
      <h1>Insan Cendekia HUB</h1>
      <p>Portal Manajemen dan Informasi Sekolah</p>
    </div>

    <form id="login-form">

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="Masukkan email"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Masukkan password"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" id="login-button">
        Masuk ke Dashboard
      </button>

      <p id="pesan" role="alert"></p>

    </form>

    <a href="index.html" class="back-link">
      ← Kembali ke halaman utama
    </a>

  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from
      "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

    // Ganti dengan konfigurasi Firebase milikmu
    const firebaseConfig = {
      apiKey: "GANTI_DENGAN_API_KEY",
      authDomain: "GANTI_DENGAN_AUTH_DOMAIN",
      projectId: "insan-cendekia-hub",
      storageBucket: "GANTI_DENGAN_STORAGE_BUCKET",
      messagingSenderId: "GANTI_DENGAN_MESSAGING_SENDER_ID",
      appId: "GANTI_DENGAN_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("login-form");
    const pesan = document.getElementById("pesan");
    const tombol = document.getElementById("login-button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      pesan.textContent = "";
      tombol.disabled = true;
      tombol.textContent = "Memeriksa akun...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        // Memeriksa email dan password
        const credential = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        const user = credential.user;

        // Mengambil profil berdasarkan UID Authentication
        const profilRef = doc(db, "pengguna", user.uid);
        const profilSnapshot = await getDoc(profilRef);

        if (!profilSnapshot.exists()) {
          throw new Error("PROFILE_NOT_FOUND");
        }

        const profil = profilSnapshot.data();

        // Memeriksa status akun dan peran
        const peranValid = [
          "admin",
          "redaksi",
          "organisasi"
        ].includes(profil.role);

        if (profil.aktif !== true || !peranValid) {
          throw new Error("ACCOUNT_NOT_ACTIVE");
        }

        // Login berhasil
        window.location.href = "dashboard.html";

      } catch (error) {
        console.error("Login error:", error);

        await signOut(auth).catch(() => {});

        if (error.code === "auth/invalid-credential") {
          pesan.textContent = "Email atau password tidak sesuai.";
        } else if (error.code === "auth/too-many-requests") {
          pesan.textContent = "Terlalu banyak percobaan. Coba lagi nanti.";
        } else if (error.message === "PROFILE_NOT_FOUND") {
          pesan.textContent = "Profil pengguna tidak ditemukan.";
        } else if (error.message === "ACCOUNT_NOT_ACTIVE") {
          pesan.textContent = "Akun tidak aktif atau perannya belum valid.";
        } else {
          pesan.textContent = "Login gagal. Periksa koneksi dan konfigurasi Firebase.";
        }

      } finally {
        tombol.disabled = false;
        tombol.textContent = "Masuk ke Dashboard";
      }
    });
  </script>

</body>
</html>
